services:
  mysql-db:
    image: mysql:8.4
    container_name: eventpass-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    command:
      - --init-file
      - /data/application/init.sql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/data/application/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eventpass-net

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: dockerfile
    container_name: eventpass-eureka
    restart: always
    environment:
      SERVER_PORT: 8761
    expose:
      - "8761"
    networks:
      - eventpass-net

  autenticacion:
    build: ./autenticacion
    container_name: service-autenticacion
    restart: always
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql-db:3306/eventpass_usuarios?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - eventpass-net

  eventos:
    build: ./eventos
    container_name: service-eventos
    restart: always
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql-db:3306/eventpass_eventos?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - eventpass-net

  ordenes:
    build: ./ordenes
    container_name: service-ordenes
    restart: always
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql-db:3306/eventpass_ordenes?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PEDIDOS_QUEUE_URL: ${PEDIDOS_QUEUE_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - eventpass-net

  tickets:
    build: ./tickets
    container_name: service-tickets
    restart: always
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql-db:3306/eventpass_tickets?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - eventpass-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: dockerfile
    container_name: eventpass-gateway
    restart: always
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - eventpass-net

networks:
  eventpass-net:
    driver: bridge

volumes:
  mysql_data:
