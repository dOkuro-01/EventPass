name: EventPass CI, AWS SAM y Docker Swarm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eventpass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build y pruebas de ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: autenticacion
            java-version: '17'
          - module: eventos
            java-version: '17'
          - module: ordenes
            java-version: '21'
          - module: tickets
            java-version: '21'
          - module: eureka-server
            java-version: '21'
          - module: api-gateway
            java-version: '21'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Compilar y ejecutar pruebas
        run: mvn -B -f "${{ matrix.module }}/pom.xml" verify

  provision-serverless:
    name: Proveer SQS, Lambda y ECR con SAM
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, eventpass-manager]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SAM_STACK_NAME: eventpass-serverless-v2
      EVENTPASS_API_BASE_URL: ${{ vars.EVENTPASS_API_BASE_URL }}
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: Validar plantilla SAM
        run: sam validate --lint --template-file aws/sam/template.yaml
      - name: Construir y desplegar recursos serverless
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENTPASS_API_BASE_URL"
          test -n "$INTERNAL_API_TOKEN"
          sam build --template-file aws/sam/template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EventPassApiBaseUrl="$EVENTPASS_API_BASE_URL" \
              InternalApiToken="$INTERNAL_API_TOKEN"

  deploy-swarm:
    name: Publicar imágenes y desplegar en Docker Swarm
    needs: provision-serverless
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, eventpass-manager]
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SAM_STACK_NAME: eventpass-serverless-v2
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inicializar el manager Docker Swarm
        shell: bash
        run: sudo bash swarm/init-manager.sh >/dev/null
      - name: Comprobar que este runner es el manager Swarm
        run: |
          test "$(sudo docker info --format '{{.Swarm.LocalNodeState}}')" = "active"
          sudo docker node ls >/dev/null
          test -n "$MYSQL_ROOT_PASSWORD"
          test -n "$INTERNAL_API_TOKEN"
      - name: Resolver salidas de SAM y autenticar ECR
        id: aws
        shell: bash
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          queue_url=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PedidosQueueUrl'].OutputValue | [0]" \
            --output text)
          test -n "$queue_url"
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          for service in autenticacion eventos ordenes tickets eureka-server api-gateway; do
            repository="eventpass/$service"
            if ! aws ecr describe-repositories --region "$AWS_REGION" \
              --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository --region "$AWS_REGION" \
                --repository-name "$repository" \
                --image-scanning-configuration scanOnPush=true >/dev/null
            fi
          done
          aws ecr get-login-password --region "$AWS_REGION" \
            | sudo docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "queue_url=$queue_url" >> "$GITHUB_OUTPUT"
      - name: Construir y publicar las seis imágenes
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.aws.outputs.registry }}
        run: |
          set -euo pipefail
          build_push() {
            local service="$1" dockerfile="$2"
            sudo docker build --pull -f "$dockerfile" -t "$ECR_REGISTRY/eventpass/$service:$IMAGE_TAG" "$service"
            sudo docker push "$ECR_REGISTRY/eventpass/$service:$IMAGE_TAG"
          }
          build_push autenticacion autenticacion/Dockerfile
          build_push eventos eventos/Dockerfile
          build_push ordenes ordenes/Dockerfile
          build_push tickets tickets/Dockerfile
          build_push eureka-server eureka-server/dockerfile
          build_push api-gateway api-gateway/dockerfile
      - name: Desplegar stack y verificar el Gateway
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.aws.outputs.registry }}
          PEDIDOS_QUEUE_URL: ${{ steps.aws.outputs.queue_url }}
        run: |
          set -euo pipefail
          sudo -E bash deploy/swarm-manager-deploy.sh -
      - name: Cerrar sesión de ECR
        if: always() && steps.aws.outputs.registry != ''
        env:
          ECR_REGISTRY: ${{ steps.aws.outputs.registry }}
        run: sudo docker logout "$ECR_REGISTRY" || true
