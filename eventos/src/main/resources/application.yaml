spring:
  application:
    name: eventos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eventpass_eventos?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8084}

app:
  internal-token: ${INTERNAL_API_TOKEN:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}}
